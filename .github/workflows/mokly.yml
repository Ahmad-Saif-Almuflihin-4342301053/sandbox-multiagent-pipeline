name: Publish catalogue
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"

      - name: Install dependencies
        run: npm ci

      - name: Publish Mokly Catalogue
        uses: mokly-ai/mokly/.github/actions/publish@v0.15.0
        with:
          version: "0.15.0"
          endpoint: "https://api.mokly.ai/v1/projects/sandbox-multiagent-pipeline/publications"
          token: ${{ secrets.MOKLY_TOKEN }}
          config: mokly.config.ts
          base: origin/main
